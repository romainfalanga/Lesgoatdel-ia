name: Poll feeds & generate articles

on:
  schedule:
    # Une fois par jour à 06:00 UTC (≈ 7h Paris hiver / 8h été).
    - cron: '0 6 * * *'
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'src/content/articles/**'
      - 'src/content/recaps/**'
      - 'src/data/playlists.json'
      - 'src/data/topics-extra.json'
      - 'data/seen.json'
      - 'data/backfill-archive.json'
      - 'data/regenerate-archive.json'
      - 'src/data/creators.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip OpenRouter calls)"
        required: false
        default: "false"

concurrency:
  group: content-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install yt-dlp (TikTok)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pip ffmpeg
          pip3 install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install deps
        run: npm ci || npm install

      - name: Refresh avatars
        run: node scripts/refresh-avatars.js
        continue-on-error: true

      - name: Poll feeds & generate articles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/poll-feeds.js --dry-run
          else
            node scripts/poll-feeds.js
          fi

      - name: Extract topics for new articles
        if: github.event.inputs.dry_run != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/extract-topics.js
        continue-on-error: true

      - name: Rebuild playlists
        if: github.event.inputs.dry_run != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Keep existing playlist titles/intros when they already exist to save
        # tokens; only new playlists get generated ones.
        run: node scripts/build-playlists.js --reuse
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          git config user.name "goats-bot"
          git config user.email "goats-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add src/content/articles src/data/creators.json src/data/playlists.json src/data/topics-extra.json data/seen.json
            git commit -m "chore(articles): nouveaux articles + topics + playlists [skip ci]"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          else
            echo "No changes to commit"
          fi
